[package]
name = "dioxus-diff-viewer"
version = "0.1.0"
edition = "2024"
description = "Show the differences between two texts in Dioxus apps"
license = "MIT"

[dependencies]
blake3 = "1.8"
dioxus = { version = "0.7", default-features = false, features = ["lib"] }
similar = "3.2"

[dev-dependencies]
dioxus-html = { version = "0.7", features = ["serialize"] }
dioxus-ssr = "0.7"
proptest = "1"
